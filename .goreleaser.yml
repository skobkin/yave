# yaml-language-server: $schema=https://raw.githubusercontent.com/goreleaser/goreleaser/v2.18.3/www/static/schema.json
version: 2

project_name: yave

gitea_urls:
  api: "{{ .Env.FORGE_API_URL }}"
  download: "{{ .Env.FORGE_DOWNLOAD_URL }}"

builds:
  - id: yave-linux
    main: ./cmd/yave
    binary: yave
    env:
      - CGO_ENABLED=1
      - CC=gcc
      - CXX=g++
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
      - -X git.skobk.in/skobkin/yave/internal/app.Version={{ .Version }}
      - -X git.skobk.in/skobkin/yave/internal/app.BuildDate={{ .Date }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - '^build(\([^)]*\))!?:'
      - '^docs(\([^)]*\))!?:'
      - '^refactor(\([^)]*\))!?:'
      - '^style(\([^)]*\))!?:'
      - '^test(\([^)]*\))!?:'
  # Entries are assigned to groups in array order — the breaking group comes
  # first so feat!/fix! never fall through to Features/Fixes — while `order`
  # controls only the render order. Regexps are matched against the bare
  # commit subject, RE2 syntax.
  groups:
    - title: BC Breaking
      regexp: '^[[:word:]]+(\([^)]*\))?!:'
      order: 0
    - title: Features
      regexp: '^feat(\([^)]*\))?!?:'
      order: 1
    - title: Fixes
      regexp: '^fix(\([^)]*\))?!?:'
      order: 2
    - title: Other changes
      order: 999
