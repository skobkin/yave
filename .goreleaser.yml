version: 2

project_name: yave

gitea_urls:
  api: "{{ .Env.FORGE_API_URL }}"
  download: "{{ .Env.FORGE_DOWNLOAD_URL }}"

builds:
  - id: yave-linux
    main: ./cmd/yave
    binary: yave
    env:
      - CGO_ENABLED=1
      - CC=gcc
      - CXX=g++
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
      - -X git.skobk.in/skobkin/yave/internal/app.Version={{ .Version }}
      - -X git.skobk.in/skobkin/yave/internal/app.BuildDate={{ .Date }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - '^build(\([^)]*\))!?:'
      - '^docs(\([^)]*\))!?:'
      - '^refactor(\([^)]*\))!?:'
      - '^style(\([^)]*\))!?:'
      - '^test(\([^)]*\))!?:'
